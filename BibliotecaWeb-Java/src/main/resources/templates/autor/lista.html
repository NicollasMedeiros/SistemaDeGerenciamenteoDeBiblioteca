<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Autores', ~{::conteudo})}">
<body>

<div th:fragment="conteudo">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-0">Autores</h1>
            <p class="text-muted small mb-0">Gerencie os autores cadastrados no acervo</p>
        </div>
        <a class="btn btn-primary" th:href="@{/autores/novo}">Novo autor</a>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/autores}">
        <div class="col-sm-9 col-md-10">
            <input type="text" class="form-control" name="busca" th:value="${busca}"
                   placeholder="Buscar autor por nome ou nacionalidade...">
        </div>
        <div class="col-sm-3 col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
        </div>
    </form>

    <div class="card border shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Nome</th>
                    <th>Nacionalidade</th>
                    <th>Biografia</th>
                    <th class="text-end" style="width: 180px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(autores)}">
                    <td colspan="5" class="text-center text-muted py-4">
                        Nenhum autor encontrado.
                    </td>
                </tr>
                <tr th:each="autor : ${autores}">
                    <td th:text="${autor.id}">1</td>
                    <td class="fw-semibold" th:text="${autor.nome}">Machado de Assis</td>
                    <td th:text="${autor.nacionalidade != null and !#strings.isEmpty(autor.nacionalidade) ? autor.nacionalidade : '—'}">—</td>
                    <td th:text="${autor.biografia != null and !#strings.isEmpty(autor.biografia) ? autor.biografia : '—'}">—</td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-1">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/autores/editar/{id}(id=${autor.id})}">Editar</a>
                            <form method="post" th:action="@{/autores/excluir/{id}(id=${autor.id})}"
                                  onsubmit="return confirm('Deseja realmente excluir este autor?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
