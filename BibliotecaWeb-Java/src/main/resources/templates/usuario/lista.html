<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Usuários', ~{::conteudo})}">
<body>

<div th:fragment="conteudo">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-0">Usuários</h1>
            <p class="text-muted small mb-0">Gerencie leitores, matrículas, contatos e situação cadastral</p>
        </div>
        <a class="btn btn-primary" th:href="@{/usuarios/novo}">Novo usuário</a>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/usuarios}">
        <div class="col-sm-9 col-md-10">
            <input type="text" class="form-control" name="busca" th:value="${busca}"
                   placeholder="Buscar usuário por nome, e-mail ou matrícula...">
        </div>
        <div class="col-sm-3 col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
        </div>
    </form>

    <div class="card border shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 65px;">ID</th>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Matrícula</th>
                    <th>Telefone</th>
                    <th class="text-center">Situação</th>
                    <th class="text-end" style="width: 180px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="text-center text-muted py-4">
                        Nenhum usuário encontrado.
                    </td>
                </tr>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}">1</td>
                    <td class="fw-semibold" th:text="${usuario.nome}">Ana Silva</td>
                    <td th:text="${usuario.email}">ana@exemplo.com</td>
                    <td th:text="${usuario.matricula != null and !#strings.isEmpty(usuario.matricula) ? usuario.matricula : '—'}">—</td>
                    <td th:text="${usuario.telefone != null and !#strings.isEmpty(usuario.telefone) ? usuario.telefone : '—'}">—</td>
                    <td class="text-center">
                        <span class="badge"
                              th:classappend="${usuario.ativo} ? 'bg-success' : 'bg-secondary'"
                              th:text="${usuario.ativo} ? 'Ativo' : 'Inativo'">
                            Ativo
                        </span>
                    </td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-1">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/usuarios/editar/{id}(id=${usuario.id})}">Editar</a>
                            <form method="post" th:action="@{/usuarios/excluir/{id}(id=${usuario.id})}"
                                  onsubmit="return confirm('Deseja realmente excluir este usuário?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
