<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${usuario.id != null ? 'Editar Usuário' : 'Novo Usuário'}, ~{::conteudo})}">
<body>

<div th:fragment="conteudo">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0" th:text="${usuario.id != null ? 'Editar Usuário' : 'Novo Usuário'}">Novo Usuário</h1>
            <p class="text-muted small mb-0">Preencha os dados do leitor e defina se o cadastro está ativo</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Voltar</a>
    </div>

    <div class="card border shadow-sm">
        <div class="card-body p-4">
            <form method="post" th:action="@{/usuarios/salvar}" th:object="${usuario}">
                <input type="hidden" th:field="*{id}">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome completo <span class="text-danger">*</span></label>
                        <input type="text" id="nome" class="form-control" th:field="*{nome}"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                               placeholder="Ex.: Mariana Souza" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">E-mail <span class="text-danger">*</span></label>
                        <input type="email" id="email" class="form-control" th:field="*{email}"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                               placeholder="Ex.: mariana@exemplo.com" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="matricula" class="form-label">Matrícula</label>
                        <input type="text" id="matricula" class="form-control" th:field="*{matricula}"
                               th:classappend="${#fields.hasErrors('matricula')} ? 'is-invalid' : ''"
                               placeholder="Ex.: 202600123">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('matricula')}" th:errors="*{matricula}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" id="telefone" class="form-control" th:field="*{telefone}"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid' : ''"
                               placeholder="Ex.: (47) 99999-9999">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>
                    </div>
                </div>

                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" role="switch" id="ativo" th:field="*{ativo}">
                    <label class="form-check-label" for="ativo">Usuário ativo (habilitado para realizar empréstimos)</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
