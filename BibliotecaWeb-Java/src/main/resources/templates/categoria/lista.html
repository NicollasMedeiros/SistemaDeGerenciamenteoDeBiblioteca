<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Categorias', ~{::conteudo})}">
<body>

<div th:fragment="conteudo">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
        <div>
            <h1 class="h3 mb-0">Categorias</h1>
            <p class="text-muted small mb-0">Gerencie as categorias de classificação do acervo</p>
        </div>
        <a class="btn btn-primary" th:href="@{/categorias/novo}">Nova categoria</a>
    </div>

    <form class="row g-2 mb-4" method="get" th:action="@{/categorias}">
        <div class="col-sm-9 col-md-10">
            <input type="text" class="form-control" name="busca" th:value="${busca}"
                   placeholder="Buscar categoria por nome...">
        </div>
        <div class="col-sm-3 col-md-2 d-grid">
            <button type="submit" class="btn btn-outline-secondary">Buscar</button>
        </div>
    </form>

    <div class="card border shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 70px;">ID</th>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th class="text-end" style="width: 180px;">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(categorias)}">
                    <td colspan="4" class="text-center text-muted py-4">
                        Nenhuma categoria encontrada.
                    </td>
                </tr>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.id}">1</td>
                    <td class="fw-semibold" th:text="${categoria.nome}">Literatura</td>
                    <td th:text="${categoria.descricao != null and !#strings.isEmpty(categoria.descricao) ? categoria.descricao : '—'}">—</td>
                    <td class="text-end">
                        <div class="d-inline-flex gap-1">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/categorias/editar/{id}(id=${categoria.id})}">Editar</a>
                            <form method="post" th:action="@{/categorias/excluir/{id}(id=${categoria.id})}"
                                  onsubmit="return confirm('Deseja realmente excluir esta categoria?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
