<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Novo Empréstimo', ~{::conteudo})}">
<body>

<div th:fragment="conteudo">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">Novo Empréstimo</h1>
            <p class="text-muted small mb-0">Selecione o leitor, o livro disponível e a data prevista para devolução</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/emprestimos}">Voltar</a>
    </div>

    <div class="card border shadow-sm">
        <div class="card-body p-4">
            <form method="post" th:action="@{/emprestimos/salvar}" th:object="${emprestimo}">
                <div class="mb-3">
                    <label for="usuario" class="form-label">Usuário <span class="text-danger">*</span></label>
                    <select id="usuario" class="form-select" th:field="*{usuario.id}"
                            th:classappend="${#fields.hasErrors('usuario')} or ${#fields.hasErrors('usuario.id')} ? 'is-invalid' : ''"
                            required>
                        <option value="">Selecione um usuário ativo...</option>
                        <option th:each="u : ${usuarios}"
                                th:value="${u.id}"
                                th:text="${u.nome + (u.matricula != null and !#strings.isEmpty(u.matricula) ? ' (' + u.matricula + ')' : '')}">
                            Usuário
                        </option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('usuario')} or ${#fields.hasErrors('usuario.id')}"
                         th:text="${#fields.hasErrors('usuario') ? #fields.errors('usuario')[0] : #fields.errors('usuario.id')[0]}"></div>
                </div>

                <div class="mb-3">
                    <label for="livro" class="form-label">Livro <span class="text-danger">*</span></label>
                    <select id="livro" class="form-select" th:field="*{livro.id}"
                            th:classappend="${#fields.hasErrors('livro')} or ${#fields.hasErrors('livro.id')} ? 'is-invalid' : ''"
                            required>
                        <option value="">Selecione um livro...</option>
                        <option th:each="l : ${livros}"
                                th:value="${l.id}"
                                th:text="${l.titulo + ' (Disponíveis: ' + l.quantidadeDisponivel + ')'}">
                            Livro
                        </option>
                    </select>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('livro')} or ${#fields.hasErrors('livro.id')}"
                         th:text="${#fields.hasErrors('livro') ? #fields.errors('livro')[0] : #fields.errors('livro.id')[0]}"></div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="dataEmprestimo" class="form-label">Data do empréstimo</label>
                        <input type="date" id="dataEmprestimo" class="form-control" th:field="*{dataEmprestimo}"
                               th:classappend="${#fields.hasErrors('dataEmprestimo')} ? 'is-invalid' : ''">
                        <div class="form-text">Se deixado em branco, o sistema assume a data de hoje.</div>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataEmprestimo')}" th:errors="*{dataEmprestimo}"></div>
                    </div>

                    <div class="col-md-6">
                        <label for="dataPrevistaDevolucao" class="form-label">Data prevista de devolução <span class="text-danger">*</span></label>
                        <input type="date" id="dataPrevistaDevolucao" class="form-control" th:field="*{dataPrevistaDevolucao}"
                               th:classappend="${#fields.hasErrors('dataPrevistaDevolucao')} ? 'is-invalid' : ''"
                               required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataPrevistaDevolucao')}" th:errors="*{dataPrevistaDevolucao}"></div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Registrar empréstimo</button>
                    <a class="btn btn-outline-secondary" th:href="@{/emprestimos}">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
